support_lifecycle:
  title: "From agentic AI to a five-stage ticket lifecycle"
  intro: "I adapted an agentic AI approach to support tickets into a five-stage lifecycle: Understand the inquiry, Classify and investigate, Insights and findings, Write, and Refine and review. I built this framework to give support teams a shared way to handle cases with technical depth, customer context, and clear communication. It can be adapted to different products, teams, and support environments."
  goal: "Support should resolve the customer’s issue, address their concerns and urgency, and understand their frustration. I designed this lifecycle to Listen, Educate, Advise, and Deliver: bridge the gap between the technology’s intended behavior and the customer’s understanding, clarify mismatched expectations, and provide actionable guidance."
  feedback: "Customer feedback is part of that process. Understanding where expectations and product behavior diverge helps turn recurring confusion, unmet needs, and suggestions into actionable items for future improvements to the product, documentation, and support experience."
  principles: "Customer focused · Thorough · Collaborative · Value driven"
  why: "A good investigation considers more than the technical issue. Customer sentiment, urgency, and familiarity with the platform shape the support we provide. This framework is designed to bring those considerations together so responses are accurate, relevant, and useful."
  value: "Teams gain a unified approach to ticket handling, clearer investigation and review checkpoints, and a consistent way to apply their own brand voice and communication guidelines. It supports a shift from reactive troubleshooting toward proactive case management, while giving teams a way to gather customer feedback and identify opportunities for future improvement."
  philosophy: "Support as a feature."
  philosophy_text: "I treat support as something we continually adapt and improve. This lifecycle is a foundation the team can refine as customer needs, tools, and the product evolve."
  stages:
    understand:
      title: "Understand the inquiry"
      summary: "Assess sentiment, urgency, and customer context."
      description: "I start with the customer’s intent, the impact of the issue, and the urgency of the request. Reviewing their previous tickets helps me understand their familiarity with the platform and choose the right level of guidance."
      checks: "Identify the inquiry and break down related issues. | Assess customer sentiment, affected users or systems, and urgency. | Review recent ticket history and tailor resources to the customer’s experience."
    investigate:
      title: "Classify and investigate"
      summary: "Define the scope and investigate the evidence."
      description: "Once the concern is understood, I classify it and determine whether it falls within our support scope. I investigate the customer’s evidence alongside the available tools, documentation, and troubleshooting resources."
      checks: "Review logs, screenshots, system behavior, and the relevant product or administration tools. | Identify missing information, investigate likely causes, and consult relevant knowledge resources. | Seek another engineer’s input or prepare an escalation when needed."
    validate:
      title: "Insights and findings"
      summary: "Validate findings and determine the next steps."
      description: "I bring the findings together, validate what happened, and identify what the customer needs to understand. The goal is to set accurate expectations, explain the issue clearly, and support the findings with relevant resources."
      checks: "Summarize the affected users or systems, configuration, symptoms, cause, and impact. | Explain findings in plain language and identify supporting documentation. | Decide whether more evidence, a call, another review, or an Engineering escalation is needed."
    respond:
      title: "Write"
      summary: "Turn the investigation into clear guidance."
      description: "I draft a structured response using the investigation and validated findings. I apply HEAT and Know, Feel, Do alongside the team’s communication guidelines, with an emphasis on explanation, relevant resources, and actionable next steps."
      checks: "Bring together the findings, their explanation, and the recommended next steps. | Include relevant product or external documentation with clear titles and links. | Update the necessary ticket fields, tags, and internal notes."
    refine:
      title: "Refine and review"
      summary: "Check accuracy, clarity, and a collaborative tone."
      description: "Before sending, I review the response for accuracy, relevance, and clarity. I prefer a collaborative tone that helps the customer feel understood. Gemini or ChatGPT can assist with refining the wording as part of this review."
      checks: "Check the customer’s name, technical details, grammar, and expectations. | Verify that links work and documentation supports the response. | Confirm communication guidelines and ticket fields, then reread the response before sending."
